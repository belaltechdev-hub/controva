name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ======================
      # CHECKOUT CODE
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4

      # ======================
      # FRONTEND (Next.js)
      # ======================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend/saas-dashboard
          npm install

      - name: Build frontend
        run: |
          cd frontend/saas-dashboard
          npm run build

      # ======================
      # BACKEND (FastAPI)
      # ======================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt